name: contract

# The reason this repository is a monorepo.
#
# The mobile app consumes a client generated from the API's OpenAPI spec. This workflow boots
# the real API, regenerates the client, and fails if the result differs from what is committed —
# so a pull request that changes a DTO without regenerating the client cannot merge.
#
# Currently manual. Switch the trigger to `pull_request` in Phase 5, once
# `packages/api-client` actually generates something. Do not weaken the diff check to make it
# pass; regenerate the client instead.

on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - 'apps/api/**'
  #     - 'packages/api-client/**'

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-is-in-sync:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pethouse
          MYSQL_DATABASE: pethouse_contract
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppethouse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: pethouse
      DB_NAME: pethouse_contract

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Dump the OpenAPI spec
        run: npm run openapi:dump --workspace @pethouse/api

      - name: Regenerate the typed client
        run: npm run generate --workspace @pethouse/api-client

      - name: Fail if the committed client is stale
        run: |
          if ! git diff --exit-code -- packages/api-client; then
            echo "::error::The committed API client does not match the current API."
            echo "Run 'npm run generate:client' and commit the result."
            exit 1
          fi
