# Local development dependencies. Run `docker compose up -d` from apps/api, then `npm run api`
# from the repository root. The API itself runs on the host, with hot reload.
#
# Image tags are pinned on purpose; `latest` is not acceptable here or in CI.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: pethouse
      MYSQL_DATABASE: pethouse
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ppethouse']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: pethouse
      MINIO_ROOT_PASSWORD: pethouse-dev-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  minio-data:
